<title>New Start Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-shaped app (max 480px) — tabs Discussions / Jeux / Progrès, WhatsApp-like chat screen on top */
:root{
  --bg:#E4E9E6;--surface:#FFFFFF;--ink:#142131;--muted:#5D6B78;--line:#DDE3E1;
  --accent:#F26B1D;--accent-ink:#FFFFFF;--head:#12324A;--head-ink:#FFFFFF;--head-muted:#A9C0D1;
  --wall:#E9EEEA;--me:#FFE1CB;--them:#FFFFFF;--ok:#1F9D63;--ok-soft:#DDF3E8;--bad:#D64545;--bad-soft:#FBE2E2;
  --fix:#FFF6D6;--fix-line:#E2BC3A;--chip:#EEF2F0;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081016;--surface:#121E27;--ink:#E8EEF2;--muted:#93A3B0;--line:#22313C;
  --accent:#FF8A3D;--accent-ink:#1A0E05;--head:#0E2533;--head-ink:#F2F6F8;--head-muted:#86A2B5;
  --wall:#0D1820;--me:#5A2E12;--them:#1A2833;--ok:#3CC98A;--ok-soft:#123326;--bad:#F07272;--bad-soft:#3A1818;
  --fix:#332B12;--fix-line:#9C8128;--chip:#1A2833;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081016;--surface:#121E27;--ink:#E8EEF2;--muted:#93A3B0;--line:#22313C;
  --accent:#FF8A3D;--accent-ink:#1A0E05;--head:#0E2533;--head-ink:#F2F6F8;--head-muted:#86A2B5;
  --wall:#0D1820;--me:#5A2E12;--them:#1A2833;--ok:#3CC98A;--ok-soft:#123326;--bad:#F07272;--bad-soft:#3A1818;
  --fix:#332B12;--fix-line:#9C8128;--chip:#1A2833;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.top{background:var(--head);color:var(--head-ink);padding:14px 16px 12px}
.top h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.01em}
.top h1 b{color:var(--accent)}
.top p{margin:2px 0 0;color:var(--head-muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips button{flex:none;padding:7px 14px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:600;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.scroll{flex:1;overflow-y:auto;min-height:0}
.contact{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.contact:hover{background:var(--chip)}
.av{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:#fff;position:relative}
.av.sm{width:40px;height:40px;font-size:15px}
.av .on{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:#2BD67B;border:2px solid var(--surface)}
.c-main{flex:1;min-width:0}
.c-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.c-name{font-weight:700}
.c-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.c-last{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:4px}
.badge{flex:none;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px}
/* chat */
.chat-top{display:flex;align-items:center;gap:10px;background:var(--head);color:var(--head-ink);padding:10px 12px}
.chat-top .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.chat-top .back:hover{background:rgba(255,255,255,.1)}
.chat-top .who{flex:1;min-width:0}
.chat-top .who b{display:block;font-size:16px}
.chat-top .who span{font-size:12.5px;color:var(--head-muted)}
.msgs{flex:1;overflow-y:auto;min-height:0;background:var(--wall);padding:14px 12px 8px;display:flex;flex-direction:column;gap:6px;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.5px);background-size:22px 22px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:8px;margin:4px 0}
.b{max-width:82%;padding:8px 11px 6px;border-radius:12px;line-height:1.42;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.06);word-wrap:break-word}
.b.them{align-self:flex-start;background:var(--them);border-top-left-radius:4px}
.b.me{align-self:flex-end;background:var(--me);border-top-right-radius:4px}
.b .meta{display:flex;justify-content:flex-end;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.b .ticks{color:var(--muted)}.b .ticks.read{color:#3AA3E8}
.b .acts{display:flex;gap:4px;margin-top:6px;border-top:1px solid var(--line);padding-top:5px}
.b .acts button{font-size:12px;font-weight:600;color:var(--accent);padding:3px 7px;border-radius:6px}
.b .acts button:hover{background:var(--chip)}
.b .fr{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:5px}
.fix{align-self:flex-end;max-width:82%;background:var(--fix);border-left:3px solid var(--fix-line);border-radius:8px;padding:7px 10px;font-size:13.5px;line-height:1.4}
.fix .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fix .better{font-weight:600}
.good{align-self:flex-end;font-size:12px;font-weight:600;color:var(--ok);padding:0 4px}
.typing{align-self:flex-start;background:var(--them);border-radius:12px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bop 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--wall);scrollbar-width:none}
.sugg button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.sugg button:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px;align-items:center;padding:8px 10px 10px;background:var(--wall)}
.composer input{flex:1;min-width:0;border:0;border-radius:22px;padding:12px 16px;background:var(--surface);color:var(--ink);font:inherit}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.round svg{width:20px;height:20px}
.round.live{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%,transparent)}}
.notice{margin:8px 12px;padding:9px 12px;border-radius:10px;background:var(--fix);font-size:13px;line-height:1.4}
/* games */
.pad{padding:16px}
.gcards{display:grid;gap:12px}
.gcard{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.gcard:hover{border-color:var(--accent)}
.gicon{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
.gcard h3{margin:0;font-family:var(--display);font-size:18px}
.gcard p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.4}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.word{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.word b{font-weight:600}.word span{color:var(--muted);text-align:right}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ghead .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--chip)}
.ghead h2{flex:1;margin:0;font-family:var(--display);font-size:20px}
.ghead .sc{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{background:var(--chip);border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:18px}
.q .en{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance}
.q .mid{color:var(--muted);font-size:13px;margin:10px 0 6px}
.q .frx{font-size:19px;font-weight:600}
.q .sent{font-size:20px;line-height:1.45;font-weight:500}
.q .blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:700}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{padding:15px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;text-align:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt.done{opacity:.45}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{font-size:14.5px;padding:13px 10px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.feedback.ok{background:var(--ok-soft)}.feedback.ko{background:var(--bad-soft)}
.primary{width:100%;margin-top:16px;padding:15px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.end{text-align:center;padding:30px 10px}
.end .big{font-family:var(--display);font-size:56px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .n{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.stat.hero{grid-column:1/-1;background:var(--head);color:var(--head-ink);border:0}
.stat.hero .l{color:var(--head-muted)}
.lvl{height:10px;border-radius:5px;background:rgba(255,255,255,.15);margin-top:10px;overflow:hidden}
.lvl i{display:block;height:100%;background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.week div{text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;height:34px;border-radius:8px;background:var(--chip);margin-bottom:4px}
.week i.on{background:var(--accent)}
.reset{margin-top:20px;color:var(--muted);font-size:13px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <!-- Discussions -->
  <section class="view" id="v-list">
    <div class="top"><h1>New <b>Start</b></h1><p>Discute en anglais avec tes contacts. Ils répondent tout de suite.</p></div>
    <div class="chips" id="filters" role="toolbar" aria-label="Filtrer les contacts"></div>
    <div class="scroll" id="contacts"></div>
  </section>

  <!-- Conversation -->
  <section class="view" id="v-chat" hidden>
    <div class="chat-top">
      <button class="back" id="chat-back" aria-label="Retour aux discussions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="av sm" id="chat-av"></div>
      <div class="who"><b id="chat-name"></b><span id="chat-status"></span></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="sugg" id="sugg" aria-label="Réponses suggérées"></div>
    <form class="composer" id="composer">
      <input id="box" autocomplete="off" placeholder="Écris en anglais… (ou en français)" aria-label="Message">
      <button type="button" class="round" id="mic" aria-label="Parler" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
      <button type="submit" class="round" id="send" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5a1 1 0 000-1.8L3.4 3.6a.9.9 0 00-1.2 1.1L4.5 11l8.5 1-8.5 1-2.3 6.3a.9.9 0 001.2 1.1z"/></svg></button>
    </form>
  </section>

  <!-- Jeux -->
  <section class="view" id="v-games" hidden>
    <div class="top"><h1>Jeux</h1><p>Deux minutes par jour, avec les expressions les plus utilisées à l'oral.</p></div>
    <div class="scroll"><div class="pad" id="games"></div></div>
  </section>

  <!-- Progrès -->
  <section class="view" id="v-prog" hidden>
    <div class="top"><h1>Progrès</h1><p>Ce que tu as pratiqué sur cet appareil.</p></div>
    <div class="scroll"><div class="pad" id="prog"></div></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Navigation">
    <button data-tab="list" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Discussions</button>
    <button data-tab="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3M15 12h.01M18 13h.01"/></svg>Jeux</button>
    <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Progrès</button>
  </nav>
</div>

<script>
const AGENTS=[
 {id:"jade",name:"Jade",init:"J",color:"#D99A1E",cat:"Quotidien",tag:"Coloc · familier",
  role:"the learner's roommate, a funny and direct 21-year-old American student from Chicago",
  style:"very casual spoken American English, contractions, light slang (gonna, kinda, no way), friendly teasing",
  first:"Heyyy! Are you home tonight? I'm making my famous pasta.",
  sugg:["Yeah, I'm home!","Sounds great!","What's up?","Not tonight, sorry."]},
 {id:"sam",name:"Sam",init:"S",color:"#3E9A62",cat:"Quotidien",tag:"Barista · café",
  role:"a warm British barista at the café downstairs who knows the learner",
  style:"polite, cheerful British English, short service phrases",
  first:"Morning! The usual, or something new today?",
  sugg:["I'd like a coffee, please.","How much is it?","Something new!","What do you recommend?"]},
 {id:"carter",name:"Mrs. Carter",init:"MC",color:"#8E2F52",cat:"Pro",tag:"Bourse · formel",
  role:"the head of an international scholarship program interviewing the learner",
  style:"formal, calm, encouraging professional English; one interview question at a time",
  first:"Good morning, and thank you for applying to our scholarship program. Could you briefly introduce yourself?",
  sugg:["Good morning. My name is…","I study computer science.","I want to study AI.","Could you repeat, please?"]},
 {id:"emma",name:"Emma Lin",init:"EL",color:"#2F6FB3",cat:"Pro",tag:"Recruteuse · entretien",
  role:"a recruiter at a tech company doing a first job interview for a junior developer role",
  style:"professional, friendly business English, asks about experience, skills and motivation",
  first:"Hi, thanks for joining the call! Can you tell me a little about your experience as a developer?",
  sugg:["I'm a fullstack developer.","I work with React and NestJS.","I'm a fast learner.","Can I ask a question?"]},
 {id:"daniel",name:"Daniel Ross",init:"DR",color:"#C2531B",cat:"Business",tag:"Vendeur · négociation",
  role:"a confident salesman in a laptop store who tries to sell expensive options",
  style:"persuasive sales English, offers deals, open to negotiation if the learner pushes",
  first:"Hi there! Looking for a new laptop? We have a great deal today.",
  sugg:["How much is it?","That's too expensive.","Can you give me a discount?","I'm just looking."]},
 {id:"grant",name:"Officer Grant",init:"OG",color:"#4B5A6A",cat:"Voyage",tag:"Aéroport · immigration",
  role:"an immigration officer at a US airport checking a student's arrival",
  style:"short, neutral, official questions: purpose of visit, length of stay, address, funding",
  first:"Good afternoon. Passport, please. What's the purpose of your visit?",
  sugg:["I'm here to study.","For one year.","Here is my passport.","Sorry, could you speak slowly?"]},
 {id:"leo",name:"Leo",init:"L",color:"#B8323D",cat:"Quotidien",tag:"Rival · débat",
  role:"an arrogant but not mean fellow scholarship student who challenges the learner to a friendly debate",
  style:"confident, ironic, competitive spoken English; gives opinions and asks the learner to defend theirs",
  first:"So, new guy. You really think you can beat me at Friday's presentation?",
  sugg:["We'll see.","Yes, I'm ready.","Good luck, Leo.","Why are you so sure?"]}
];
const CATS=["Tous","Quotidien","Pro","Business","Voyage"];
const CAT_COLOR={Quotidien:"#D99A1E",Pro:"#2F6FB3",Business:"#C2531B",Voyage:"#4B5A6A"};

const EXPR=[
 ["Nice to meet you","Enchanté(e)","Hi, I'm Jade. — ___! I'm Awa."],
 ["What's up?","Quoi de neuf ?","Hey Sam, ___ — Not much, just working."],
 ["No problem","De rien, pas de problème","Thanks for your help! — ___."],
 ["Of course","Bien sûr","Can I sit here? — ___, go ahead."],
 ["I don't know","Je ne sais pas","Where is Leo? — ___. Maybe at the café."],
 ["Excuse me","Excusez-moi","___, where is the station?"],
 ["Come on","Allez ! Dépêche-toi","___, we're late! Hurry!"],
 ["I'm sorry","Je suis désolé","___, I broke your cup."],
 ["Don't worry","Ne t'inquiète pas","I lost my key! — ___, I have another one."],
 ["Good luck","Bonne chance","My exam is tomorrow. — ___!"],
 ["How much is it?","C'est combien ?","I like this bag. ___ — Twenty dollars."],
 ["Here you go","Tiens, voilà","One coffee, please. — ___!"],
 ["I'd like","Je voudrais","___ a large tea, please."],
 ["Let's go","On y va !","Everyone is ready? ___!"],
 ["I see","Je vois","The meeting is at 9, not 10. — Oh, ___."],
 ["What happened?","Qu'est-ce qui s'est passé ?","Why are you crying? ___"],
 ["Are you okay?","Tu vas bien ?","You fell! ___"],
 ["Never mind","Laisse tomber","Sorry, what did you say? — ___, it's not important."],
 ["By the way","Au fait","___, Jade called you this morning."],
 ["Hold on","Attends","___, I need to find my phone."],
 ["I'm in","Je suis partant","Pizza tonight? — Yes, ___!"],
 ["No way","C'est pas vrai !","I won the scholarship! — ___! Congrats!"],
 ["Take care","Prends soin de toi","Bye Sam! — ___, see you tomorrow."],
 ["Fair enough","D'accord, c'est normal","I can't come, I'm working. — ___."],
 ["Sounds great","Ça a l'air génial","Let's watch a movie tonight. — ___!"],
 ["Could you","Pourriez-vous","___ repeat that, please?"],
 ["Have a seat","Asseyez-vous","Good morning, come in. ___."],
 ["Tell me about it","À qui le dis-tu !","This exam is so hard. — ___!"],
 ["I'm just saying","Je dis ça, je dis rien","Your shirt is… interesting. ___."],
 ["Sorry I'm late","Désolé, je suis en retard","___, the bus was full."]
];

/* ---------- état (stocké sur cet appareil) ---------- */
const KEY="newstart-proto-v1";
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||!S.chats)S={xp:0,sent:0,fixes:0,right:0,tries:0,days:[],seen:[],chats:{},unread:{}};
for(const a of AGENTS){if(!S.chats[a.id]){S.chats[a.id]=[{r:"a",t:a.first,at:Date.now()-60000*(3+AGENTS.indexOf(a)*17)}];S.unread[a.id]=1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
function active(){if(!S.days.includes(today())){S.days.push(today());S.days=S.days.slice(-60)}}
function xp(n){S.xp+=n;active();save()}

/* ---------- utilitaires ---------- */
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function hhmm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function avatar(a,sm){const d=el("div","av"+(sm?" sm":""),a.init);d.style.background=`linear-gradient(140deg, ${a.color}, color-mix(in srgb, ${a.color} 60%, #000))`;return d}
const $=id=>document.getElementById(id);

/* ---------- capacités ---------- */
let sample=null,dict=null;
const canSpeak="speechSynthesis" in window;
(async()=>{
  try{sample=await (window.claude?.use?.("sample")??null)}catch(e){sample=null}
  try{dict=await (window.claude?.use?.("dictation")??null)}catch(e){dict=null}
  if(dict)setupMic();
  if(cur)renderChat();
})();

/* ---------- navigation ---------- */
let tab="list",cur=null;
function show(view){for(const v of ["list","chat","games","prog"])$("v-"+v).hidden=v!==view;$("tabs").hidden=view==="chat"}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;
  for(const x of $("tabs").children)x.toggleAttribute("aria-current",x===b),x===b&&x.setAttribute("aria-current","page");
  show(tab);if(tab==="list")renderList();if(tab==="games")renderGames();if(tab==="prog")renderProg()});
$("chat-back").onclick=()=>{cur=null;show("list");renderList()};

/* ---------- liste des contacts ---------- */
let filter="Tous";
function renderFilters(){const f=$("filters");f.textContent="";for(const c of CATS){const b=el("button",null,c);b.setAttribute("aria-pressed",String(c===filter));b.onclick=()=>{filter=c;renderFilters();renderList()};f.append(b)}}
function renderList(){
  const box=$("contacts");box.textContent="";
  const list=AGENTS.filter(a=>filter==="Tous"||a.cat===filter).sort((x,y)=>last(y).at-last(x).at);
  for(const a of list){
    const m=last(a),b=el("button","contact");
    const av=avatar(a);av.append(el("span","on"));b.append(av);
    const main=el("div","c-main"),r1=el("div","c-row"),r2=el("div","c-row");
    r1.append(el("span","c-name",a.name),el("span","c-time",hhmm(m.at)));
    r2.append(el("span","c-last",(m.r==="u"?"Toi : ":"")+m.t));
    if(S.unread[a.id])r2.append(el("span","badge",String(S.unread[a.id])));
    const t=el("span","tag",a.tag);t.style.background=`color-mix(in srgb, ${CAT_COLOR[a.cat]} 16%, transparent)`;t.style.color=CAT_COLOR[a.cat];
    main.append(r1,r2,t);b.append(main);b.onclick=()=>openChat(a.id);box.append(b);
  }
}
function last(a){const c=S.chats[a.id];return c[c.length-1]}

/* ---------- conversation ---------- */
let busy=false,ctl=null;
function openChat(id){cur=AGENTS.find(a=>a.id===id);S.unread[id]=0;save();
  const av=$("chat-av");av.replaceWith(Object.assign(avatar(cur,true),{id:"chat-av"}));
  $("chat-name").textContent=cur.name;$("chat-status").textContent="en ligne · "+cur.tag;
  show("chat");renderChat();setTimeout(()=>$("box").focus(),50)}
function renderChat(){
  if(!cur)return;const box=$("msgs");box.textContent="";box.append(el("div","day","Aujourd'hui"));
  if(!sample&&!busy){box.append(el("div","notice","Les réponses des agents fonctionnent quand la page est ouverte dans Claude, une fois l'accès autorisé. Les jeux et le reste de l'appli marchent partout."))}
  const msgs=S.chats[cur.id];
  msgs.forEach((m,i)=>{
    const b=el("div","b "+(m.r==="u"?"me":"them"));b.append(el("div",null,m.t));
    const meta=el("div","meta",hhmm(m.at));
    if(m.r==="u"){const read=i<msgs.length-1;meta.append(el("span","ticks"+(read?" read":""),"✓✓"))}
    b.append(meta);
    if(m.r==="a"){
      if(m.fr)b.append(el("div","fr",m.fr));
      const acts=el("div","acts");
      if(canSpeak){const s=el("button",null,"Écouter");s.onclick=()=>speak(m.t);acts.append(s)}
      if(sample&&!m.fr){const tr=el("button",null,"Traduire");tr.onclick=()=>translate(m,tr);acts.append(tr)}
      if(acts.childElementCount)b.append(acts);
    }
    box.append(b);
    if(m.r==="u"&&m.fix){const f=el("div","fix");f.append(el("div","lbl","Plus naturel"),el("div","better",m.fix.better),el("div",null,m.fix.why));box.append(f)}
    if(m.r==="u"&&m.ok)box.append(el("div","good","Parfait, rien à corriger"));
  });
  if(busy){const t=el("div","typing");t.append(el("i"),el("i"),el("i"));box.append(t)}
  box.scrollTop=box.scrollHeight;
  const sg=$("sugg");sg.textContent="";for(const s of cur.sugg){const b=el("button",null,s);b.onclick=()=>{$("box").value=s.endsWith("…")?s.slice(0,-1)+" ":s;$("box").focus();syncBtns()};sg.append(b)}
  $("chat-status").textContent=busy?"écrit…":"en ligne · "+cur.tag;
}
function rules(a){return `You are ${a.name}, ${a.role}. You are chatting on a WhatsApp-like messaging app with a French-speaking learner of English (level A2, from Senegal, wants an international scholarship).
Style: ${a.style}.
Rules for "reply": English only, 1 to 3 short sentences, common spoken words, stay fully in character, never mention you are an AI, and keep the conversation going (often end with a question). If the learner writes in French, answer in simple English as if you understood.
Then check the learner's LAST message only. If it has a mistake, sounds unnatural, or is in French, give a corrected natural English version and a very short explanation in French (max 15 words). If it is already correct and natural, use null.
Reply with only this JSON: {"reply":"...","fix":null} or {"reply":"...","fix":{"better":"...","why":"..."}}`}
async function sendMsg(text){
  text=text.trim();if(!text||busy||!cur)return;
  const a=cur,msgs=S.chats[a.id];const um={r:"u",t:text,at:Date.now()};msgs.push(um);
  S.sent++;xp(10);$("box").value="";syncBtns();
  if(!sample){renderChat();return}
  busy=true;renderChat();
  const turns=[{role:"user",content:rules(a)}];
  for(const m of msgs.slice(-16))turns.push({role:m.r==="u"?"user":"assistant",content:m.t});
  ctl=new AbortController();
  try{
    const res=await sample.json(turns,{modelTier:"quick",cache:false,signal:ctl.signal});
    const reply=String(res&&res.reply||"").trim()||"Sorry, can you say that again?";
    if(res&&res.fix&&res.fix.better){um.fix={better:String(res.fix.better),why:String(res.fix.why||"")};S.fixes++}else um.ok=true;
    msgs.push({r:"a",t:reply,at:Date.now()});
  }catch(e){
    const msg={not_granted:"Accès à Claude refusé pour cette page : les agents ne peuvent pas répondre.",rate_limited:"Trop de messages d'un coup. Réessaie dans un instant.",session_expired:"Reconnecte-toi à Claude pour continuer."}[e&&e.code]||"Le message n'est pas passé. Renvoie-le.";
    if(e&&e.code==="not_granted"||e&&e.code==="sampling_disabled")sample=null;
    msgs.push({r:"a",t:"⚠ "+msg,at:Date.now(),sys:true});
  }
  busy=false;save();if(cur===a)renderChat();else{S.unread[a.id]=(S.unread[a.id]||0)+1;save()}
}
async function translate(m,btn){btn.disabled=true;btn.textContent="Traduction…";
  try{const {text}=await sample("Translate this chat message into natural spoken French. Reply with only the translation.\n\n"+m.t,{modelTier:"quick"});m.fr=text.trim();save();renderChat()}
  catch(e){btn.disabled=false;btn.textContent="Traduire"}}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/^⚠\s*/,""));u.lang="en-US";u.rate=.92;
  const v=speechSynthesis.getVoices().find(v=>/^en(-|_)(US|GB)/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
$("composer").addEventListener("submit",e=>{e.preventDefault();sendMsg($("box").value)});
$("box").addEventListener("input",syncBtns);
function syncBtns(){const empty=!$("box").value.trim();if(dict){$("mic").hidden=!empty;$("send").hidden=empty}}

/* ---------- dictée ---------- */
let listening=false,base="";
function setupMic(){
  syncBtns();
  dict.onPartial(({text})=>{$("box").value=(base+" "+text).trim()});
  dict.onFinal(({text})=>{base=(base+" "+text).trim();$("box").value=base});
  dict.onState(({state})=>{listening=state==="listening";$("mic").classList.toggle("live",listening);if(!listening){syncBtns()}});
  $("mic").onclick=()=>{
    if(listening){dict.stop().catch(()=>{});return}
    base=$("box").value.trim();
    dict.start().catch(e=>{if(e&&e.code==="not_granted"){$("mic").hidden=true;$("send").hidden=false;dict=null}});
  };
}

/* ---------- jeux ---------- */
const GAMES=[
 {id:"vf",title:"Vrai ou faux",desc:"Une expression, une traduction. C'est juste ou pas ?",icon:"V/F",col:"#2F6FB3"},
 {id:"mm",title:"Mot manquant",desc:"Complète la phrase avec la bonne expression.",icon:"_ _",col:"#C2531B"},
 {id:"as",title:"Associer",desc:"Relie chaque expression anglaise à son sens.",icon:"⇄",col:"#3E9A62"}
];
let G=null;
function renderGames(){
  const root=$("games");root.textContent="";
  if(G){playScreen(root);return}
  const cards=el("div","gcards");
  for(const g of GAMES){const b=el("button","gcard"),ic=el("div","gicon",g.icon);ic.style.background=`color-mix(in srgb, ${g.col} 16%, transparent)`;ic.style.color=g.col;
    const tx=el("div");tx.append(el("h3",null,g.title),el("p",null,g.desc));b.append(ic,tx);b.onclick=()=>startGame(g.id);cards.append(b)}
  root.append(cards,el("div","sec","Expressions du jour"));
  const start=(new Date().getDate()*3)%EXPR.length;
  for(let i=0;i<5;i++){const x=EXPR[(start+i)%EXPR.length],w=el("div","word");w.append(el("b",null,x[0]),el("span",null,x[1]));root.append(w)}
}
function startGame(id){
  const pool=shuffle(EXPR);
  if(id==="as")G={id,round:0,rounds:3,score:0,total:12,pool,sel:null,matched:0};
  else G={id,i:0,n:10,score:0,pool,answered:false};
  if(id==="as")prepRound();
  renderGames();
}
function prepRound(){const set=G.pool.slice(G.round*4,G.round*4+4);G.left=shuffle(set);G.right=shuffle(set);G.sel=null;G.matched=0}
function head(root,title,score,frac){
  const h=el("div","ghead"),bk=el("button","back");bk.setAttribute("aria-label","Quitter le jeu");
  bk.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';
  bk.onclick=()=>{G=null;renderGames()};h.append(bk,el("h2",null,title),el("span","sc",score+" pts"));
  const bar=el("div","bar"),fill=el("i");fill.style.width=Math.round(frac*100)+"%";bar.append(fill);root.append(h,bar)}
function playScreen(root){
  const g=GAMES.find(x=>x.id===G.id);
  if(G.id!=="as"&&G.i>=G.n||G.id==="as"&&G.round>=G.rounds){endScreen(root,g);return}
  if(G.id==="as"){head(root,g.title,G.score,G.round/G.rounds);matchScreen(root);return}
  head(root,g.title,G.score,G.i/G.n);
  const item=G.pool[G.i%G.pool.length];
  if(!G.q){
    if(G.id==="vf"){const truth=Math.random()<.5;const other=EXPR.filter(x=>x!==item)[Math.floor(Math.random()*(EXPR.length-1))];G.q={truth,fr:truth?item[1]:other[1]}}
    else{const opts=shuffle([item[0],...shuffle(EXPR.filter(x=>x!==item)).slice(0,3).map(x=>x[0])]);G.q={opts}}
  }
  const q=el("div","q");
  if(G.id==="vf"){q.append(el("div","en","« "+item[0]+" »"),el("div","mid","veut dire"),el("div","frx","« "+G.q.fr+" »"))}
  else{const s=el("div","sent");const parts=item[2].split("___");s.append(parts[0]);const bl=el("span","blank",G.answered?item[0]:" ");s.append(bl,parts[1]||"");q.append(s)}
  root.append(q);
  const opts=el("div","opts"+(G.id==="vf"?" two":""));
  const choices=G.id==="vf"?["Vrai","Faux"]:G.q.opts;
  for(const c of choices){
    const b=el("button","opt",c);
    const correct=G.id==="vf"?(c==="Vrai")===G.q.truth:c===item[0];
    if(G.answered){b.disabled=true;if(correct)b.classList.add("right");else if(G.pick===c)b.classList.add("wrong")}
    b.onclick=()=>{if(G.answered)return;G.answered=true;G.pick=c;S.tries++;if(correct){G.score+=5;S.right++;xp(5)}else save();
      if(!S.seen.includes(item[0]))S.seen.push(item[0]);save();renderGames()};
    opts.append(b)}
  root.append(opts);
  if(G.answered){
    const ok=G.id==="vf"?((G.pick==="Vrai")===G.q.truth):G.pick===item[0];
    const fb=el("div","feedback "+(ok?"ok":"ko"));
    fb.append(el("b",null,ok?"Bien vu ! ":"Pas tout à fait. "),document.createTextNode("« "+item[0]+" » = "+item[1]+". Exemple : "+item[2].replace("___",item[0])));
    root.append(fb);
    const nx=el("button","primary",G.i===G.n-1?"Voir mon score":"Question suivante");nx.onclick=()=>{G.i++;G.q=null;G.answered=false;G.pick=null;renderGames()};root.append(nx);
    if(canSpeak){const s=el("button","reset","Écouter l'exemple");s.onclick=()=>speak(item[2].replace("___",item[0]).replace(/—/g,","));root.append(s)}
  }
}
function matchScreen(root){
  root.append(el("p",null,"Touche une expression, puis son sens."));
  const m=el("div","match"),L=el("div","col"),R=el("div","col");
  G.left.forEach(x=>{const b=el("button","opt",x[0]);if(x.done){b.classList.add("right","done");b.disabled=true}if(G.sel===x)b.classList.add("picked");
    b.onclick=()=>{G.sel=x;renderGames()};L.append(b)});
  G.right.forEach(x=>{const b=el("button","opt",x[1]);if(x.done){b.classList.add("right","done");b.disabled=true}
    b.onclick=()=>{if(!G.sel)return;S.tries++;
      if(G.sel===x){x.done=true;G.matched++;G.score+=5;S.right++;xp(5);if(!S.seen.includes(x[0]))S.seen.push(x[0]);save();G.sel=null;
        if(G.matched===4){G.left.forEach(y=>delete y.done);G.round++;if(G.round<G.rounds)prepRound()}
        renderGames()}
      else{save();b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake","wrong");setTimeout(()=>b.classList.remove("wrong"),400)}};
    R.append(b)});
  m.append(L,R);root.append(m);
}
function endScreen(root,g){
  const max=G.id==="as"?60:50,e=el("div","end");
  e.append(el("div","sec",g.title),el("div","big",G.score+" / "+max),el("p",null,G.score>=max*.8?"Excellent, tu maîtrises ces expressions.":"Bon entraînement. Rejoue pour les fixer."));
  const again=el("button","primary","Rejouer");again.onclick=()=>startGame(G.id);
  const back=el("button","reset","Retour aux jeux");back.onclick=()=>{G=null;renderGames()};
  e.append(again,back);root.append(e);
}

/* ---------- progrès ---------- */
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
function renderProg(){
  const root=$("prog");root.textContent="";
  const lvl=Math.floor(S.xp/200)+1,inLvl=S.xp%200;
  const st=el("div","stats"),hero=el("div","stat hero");
  hero.append(el("div","l","Niveau "+lvl),el("div","n",S.xp+" XP"));const bar=el("div","lvl"),f=el("i");f.style.width=(inLvl/2)+"%";bar.append(f);
  hero.append(bar,el("div","l",(200-inLvl)+" XP avant le niveau "+(lvl+1)));st.append(hero);
  const acc=S.tries?Math.round(S.right/S.tries*100)+" %":"–";
  for(const [n,l] of [[streak()+" j","Série en cours"],[S.sent,"Messages envoyés"],[S.fixes,"Corrections reçues"],[acc,"Réussite aux jeux"]]){const c=el("div","stat");c.append(el("div","n",String(n)),el("div","l",l));st.append(c)}
  root.append(st,el("div","sec","Ces 7 derniers jours"));
  const wk=el("div","week"),names=["D","L","M","M","J","V","S"];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const c=el("div"),b=el("i");if(S.days.includes(d.toISOString().slice(0,10)))b.className="on";c.append(b,names[d.getDay()]);wk.append(c)}
  root.append(wk,el("div","sec","Expressions pratiquées · "+S.seen.length+" / "+EXPR.length));
  if(!S.seen.length)root.append(el("p",null,"Joue une partie pour remplir cette liste."));
  for(const x of EXPR.filter(x=>S.seen.includes(x[0]))){const w=el("div","word");w.append(el("b",null,x[0]),el("span",null,x[1]));root.append(w)}
  let armed=false;const r=el("button","reset","Effacer ma progression");
  r.onclick=()=>{if(!armed){armed=true;r.textContent="Touche encore pour confirmer";return}try{localStorage.removeItem(KEY)}catch(e){}location.reload()};root.append(r);
}

renderFilters();renderList();
</script>
