# Valeurs par défaut. Les cibles (VPS, AWS) les surchargent dans values-vps.yaml et values-aws.yaml.
image:
  registry: ghcr.io/yahyadrame
  # Vide : on prend appVersion du chart. En déploiement, Argo CD pose le SHA du commit.
  tag: ''
  pullPolicy: IfNotPresent

# Nom du Secret Kubernetes qui porte DATABASE_URL, JWT_PRIVATE_KEY, GROQ_API_KEY, etc.
# Jamais écrit en clair dans Git : sur VPS il vient d'un SealedSecret, sur AWS d'un ExternalSecret.
secretName: new-start-secrets

# Sealed Secrets (VPS). `encryptedData` se remplit avec kubeseal, une fois le contrôleur installé (phase 2).
sealedSecret:
  enabled: false
  encryptedData: {}

# External Secrets (AWS). Le SecretStore pointe vers AWS Secrets Manager ; chaque clé y vit sous `<prefix>/<NOM>`.
externalSecrets:
  enabled: false
  storeName: aws-secrets-manager
  keyPrefix: new-start
  keys:
    - DATABASE_URL
    - REDIS_URL
    - JWT_PRIVATE_KEY
    - GROQ_API_KEY
    - GEMINI_API_KEY
    - GOOGLE_CLIENT_SECRET
    - BREVO_API_KEY
    - CLOUDINARY_URL
    - MEDIA_B2_KEY_ID
    - MEDIA_B2_SECRET
    - MEDIA_R2_KEY_ID
    - MEDIA_R2_SECRET
    - SENTRY_DSN

# Variables non secrètes de l'API et du worker.
config:
  NODE_ENV: production
  LOG_LEVEL: info
  RUN_JOBS: separate
  CORS_ORIGINS: ''
  LLM_PROVIDER: groq
  STT_PROVIDER: groq
  TTS_PROVIDER: gemini
  AI_MAX_CALLS_PER_MONTH: '2000'
  MEDIA_PROVIDER: ''
  MEDIA_B2_ENDPOINT: ''
  MEDIA_B2_REGION: ''
  MEDIA_B2_BUCKET: ''
  MEDIA_R2_ENDPOINT: ''
  MEDIA_R2_REGION: ''
  MEDIA_R2_BUCKET: ''

api:
  replicas: 3
  port: 4000
  pdb: { minAvailable: 2 }
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 20, cpuUtilization: 65 }
  resources:
    requests: { cpu: 250m, memory: 384Mi, ephemeral-storage: 256Mi }
    limits: { memory: 768Mi }

web:
  replicas: 2
  port: 3000
  pdb: { minAvailable: 1 }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10, cpuUtilization: 65 }
  resources:
    requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
    limits: { memory: 512Mi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
    limits: { memory: 512Mi }

# Entrée HTTP(S). Les noms de domaine sont des exemples réservés : values-vps.yaml et values-aws.yaml posent les vrais.
ingress:
  className: nginx
  webHost: app.example.com
  apiHost: api.example.com
  tlsSecretName: new-start-tls
  # Namespace de l'Ingress NGINX, seul autorisé à joindre web et api depuis l'extérieur.
  controllerNamespace: ingress-nginx

# Certificats Let's Encrypt via cert-manager (installé à part, avec ses CRD).
certManager:
  enabled: true
  issuerName: letsencrypt
  email: admin@example.com
  server: https://acme-v02.api.letsencrypt.org/directory
