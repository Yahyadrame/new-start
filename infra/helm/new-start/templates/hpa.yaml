{{- range $app := list "api" "web" }}
{{- $conf := index $.Values $app }}
{{- if $conf.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $app }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $app }} }
  minReplicas: {{ $conf.autoscaling.minReplicas }}
  maxReplicas: {{ $conf.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $conf.autoscaling.cpuUtilization }} }
{{- end }}
{{- end }}
