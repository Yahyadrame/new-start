{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.externalSecrets.storeName }} }
  target: { name: {{ .Values.secretName }} }
  data:
    {{- range .Values.externalSecrets.keys }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ $.Values.externalSecrets.keyPrefix }}/{{ . }} }
    {{- end }}
{{- end }}
