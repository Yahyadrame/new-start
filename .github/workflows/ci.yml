name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet, utile à SonarQube (NS-006)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0 # version lue dans packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm depcruise
      - run: pnpm helm:check # chart Helm : lint, rendu, kubeconform (NS-007)
      - run: pnpm typecheck
      - run: pnpm test
      # Jeton et variables saisis par le porteur (NS-006). Sans jeton (PR venant d'un fork), l'analyse est sautée.
      - name: Analyse SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
