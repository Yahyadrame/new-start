name: nightly

# Contrôles de nuit (NS-609). Pour l'instant : audit des dépendances de production.
# À venir, quand les accès existent : e2e sur staging, évaluations IA, OWASP ZAP.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0 # version lue dans packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit des dépendances (échec dès une faille moyenne)
        run: pnpm audit --prod --audit-level=moderate
