name: nightly

# Contrôles de nuit (NS-609). Pour l'instant : audit des dépendances de production.
# À venir, quand les accès existent : e2e sur staging, évaluations IA, OWASP ZAP.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 # version lue dans packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit des dépendances (échec dès une faille moyenne)
        run: pnpm audit --prod --audit-level=moderate
