name: cd-staging

# À chaque fusion sur main : construit les images, les scanne (Trivy), puis les publie sur GHCR (NS-004).
# Puis migre la base Neon, déclenche le déploiement Render et vérifie /health/ready (NS-008).
# Chaque étape est sautée tant que son secret ou sa variable n'est pas saisi par le porteur du projet.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (GHCR exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/newstart-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construit l'image (sans la publier)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Scan Trivy (échec sur CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publie l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:staging
          cache-from: type=gha,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, version de pnpm lue dans packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations avant le déploiement : elles suivent « étendre puis contracter » (docs/10-devops.md).
      - name: Migre la base Neon
        if: env.DATABASE_URL != ''
        run: pnpm --filter @newstart/api exec prisma migrate deploy
      - name: Déclenche le déploiement Render
        if: env.DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --output /dev/null --request POST "$DEPLOY_HOOK"
      # ponytail: peut répondre avec l'ancienne version avant la fin du déploiement ; comparer un numéro de version si cela gêne.
      - name: Test de fumée sur /health/ready
        if: env.API_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent --max-time 10 "$API_URL/health/ready" && exit 0
            sleep 10
          done
          echo "L'API ne répond pas sur /health/ready après 5 minutes" >&2
          exit 1
